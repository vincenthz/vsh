[package]
name = "vsh"
version = "0.1.0"
edition = "2024"
description = "A small zsh-flavoured shell with builtin coreutils, for macOS, Linux and Windows"
license = "MIT OR Apache-2.0"

[dependencies]
jiff = "0.2"
regex = "1.13"
rustyline = "19"
terminal_size = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[profile.release]
lto = true
codegen-units = 1
